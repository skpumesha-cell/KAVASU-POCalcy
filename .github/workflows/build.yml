name: Build MSI

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: windows-2022
    strategy:
      matrix:
        arch: [x86, x64]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.8'
          architecture: ${{ matrix.arch }}

      - name: Install PyInstaller
        run: python -m pip install -r requirements.txt

      - name: Build EXE (logo + icon embedded)
        shell: cmd
        run: >
          python -m PyInstaller --noconfirm --clean --onefile --windowed
          --name KAVASU_PostofficeCalcy --icon assets\kavasu.ico
          --add-data "assets\logo.png;assets"
          --add-data "assets\logo_header.png;assets"
          --add-data "assets\kavasu.ico;assets"
          app.py

      - name: Install WiX Toolset
        run: choco install wixtoolset -y --no-progress

      - name: Build MSI
        shell: pwsh
        run: |
          $wix = (Get-ChildItem "C:\Program Files (x86)" -Directory -Filter "WiX Toolset*" | Select-Object -First 1).FullName
          New-Item -ItemType Directory -Force dist_msi, build | Out-Null
          $src = "$PWD\dist\KAVASU_PostofficeCalcy.exe"
          $ico = "$PWD\assets\kavasu.ico"
          & "$wix\bin\candle.exe" -nologo -arch ${{ matrix.arch }} "-dSourceExe=$src" "-dIconFile=$ico" -out build\Product.wixobj installer\Product.wxs
          if ($LASTEXITCODE -ne 0) { exit 1 }
          & "$wix\bin\light.exe" -nologo -sval -out "dist_msi\KAVASU_PostofficeCalcy_${{ matrix.arch }}.msi" build\Product.wixobj
          if ($LASTEXITCODE -ne 0) { exit 1 }

      - uses: actions/upload-artifact@v4
        with:
          name: KAVASU_PostofficeCalcy_${{ matrix.arch }}_MSI
          path: dist_msi/*.msi
